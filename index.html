<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Hub - Парфюмерный Маркетплейс</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="header-left">
            <div class="logo">
                <h1 id="logoBtn">✨ Perfume Hub</h1>
                <p class="tagline">Премиум парфюмерный маркетплейс</p>
            </div>
        </div>
        <nav>
            <button id="loginViewBtn" class="active">Вход</button>
            <button id="registerViewBtn">Регистрация</button>
        </nav>
    </header>

    <!-- ГЛАВНАЯ СТРАНИЦА (Прайс-листы) -->
    <main id="buyerSection">
        <h2>Предложения</h2>
        <div id="pricelistContainer" class="grid">
            <!-- Карточки будут добавлены через JavaScript -->
        </div>
    </main>

    <!-- СТРАНИЦА ПРОДАВЦА -->
    <section id="sellerSection" class="hidden">
        
        <!-- Форма входа -->
        <div id="loginForm" class="card auth-card">
            <h2>Вход для продавцов</h2>
            <input type="email" id="loginEmailInput" placeholder="Электронная почта" required>
            <input type="password" id="loginPasswordInput" placeholder="Пароль" required>
            <div class="btn-group">
                <button id="loginBtn">Войти</button>
            </div>
            <p class="login-link">Нет аккаунта? <a href="#" id="showRegisterBtn">Зарегистрироваться</a></p>
            <p id="loginMessage"></p>
        </div>

        <!-- Форма регистрации -->
        <div id="authForm" class="card auth-card hidden">
            <h2>Регистрация продавца</h2>
            <div class="form-row">
                <input type="text" id="nameInput" placeholder="Имя" required>
                <input type="text" id="surnameInput" placeholder="Фамилия" required>
            </div>
            <input type="email" id="emailInput" placeholder="Электронная почта" required>
            <input type="tel" id="phoneInput" placeholder="Телефон" required>
            <input type="password" id="passwordInput" placeholder="Пароль" required>
            <input type="password" id="verifyPasswordInput" placeholder="Подтвердите пароль" required>
            <div class="btn-group">
                <button id="registerBtn">Зарегистрироваться</button>
            </div>
            <p class="login-link">Уже есть аккаунт? <a href="#" id="showLoginBtn">Войти</a></p>
            <p id="authMessage"></p>
        </div>

        <!-- Панель продавца (после входа) -->
        <div id="dashboard" class="hidden">
            <h2>Добро пожаловать, <span id="sellerName"></span>!</h2>
            <div class="card">
                <h3>Опубликовать прайс-лист на сегодня</h3>
                <textarea id="pricelistInput" placeholder="Введите ваш прайс-лист (например: Chanel No.5: 15000₽, Dior Sauvage: 12000₽)"></textarea>
                <button id="postPricelistBtn">Опубликовать прайс-лист</button>
            </div>
            <button id="logoutBtn" class="logout">Выйти</button>
        </div>

    </section>

    <script src="app.js"></script>
</body>
</html>
